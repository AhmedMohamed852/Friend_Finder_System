services:

  db:
    image: postgres:16
    container_name: friendfinder-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: friendfinder
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: friendfinder-redis
    command: redis-server --requirepass 123456
    ports:
      - "6379:6379"

  backend:
    image: friendfinder-backend
    container_name: friendfinder-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/friendfinder
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: "123456"
    depends_on:
      - db
      - redis